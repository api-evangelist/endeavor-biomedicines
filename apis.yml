aid: endeavor-biomedicines
name: Endeavor BioMedicines
description: 'Endeavor BioMedicines is a clinical-stage biotechnology company headquartered
  in San Diego, California, developing medicines aimed at reversing — not merely slowing
  — the course of life-threatening fibrotic and oncologic disease. Its lead investigational
  candidate, taladegib (ENV-101), is an inhibitor of the Hedgehog signaling pathway
  in clinical development for idiopathic pulmonary fibrosis, and it has in-licensed
  HMBD-501, a next-generation HER3-targeted antibody-drug conjugate. Endeavor publishes
  no developer program or product API; the machine-readable surface profiled here is
  the public WordPress REST API served from its corporate website, together with an
  authenticated WordPress MCP server and the RFC 8414 / RFC 9728 OAuth 2.1 discovery
  documents that host advertises.'
