apis:
- name: Endeavor BioMedicines WordPress MCP Server
  description: >-
    An MCP (Model Context Protocol) server exposed by the WordPress MCP adapter at /wp-json/mcp/mcp-oauth-server
    on endeavorbiomedicines.com. The endpoint is live but authentication-gated: an anonymous initialize
    / tools/list returns HTTP 401 mcp_unauthorized. Its authorization server metadata is published anonymously
    at /.well-known/oauth-authorization-server (OAuth 2.1, authorization_code + refresh_token, PKCE S256,
    single scope "mcp"), and the protected-resource metadata at /.well-known/oauth-protected-resource.
  humanURL: https://endeavorbiomedicines.com/.well-known/oauth-protected-resource
  baseURL: https://endeavorbiomedicines.com/wp-json/mcp/mcp-oauth-server
