apis:
- name: Endeavor BioMedicines WordPress REST API
  description: 'The public WordPress REST API served by endeavorbiomedicines.com. Content
    read operations — posts, pages, media, taxonomies and types — answer anonymously,
    which makes the company''s press releases, pipeline pages and media library machine-readable.
    Write and administrative operations require WordPress authentication. This is a
    site-platform API rather than a product API: Endeavor BioMedicines publishes no
    developer portal, no API documentation and no plans.'
